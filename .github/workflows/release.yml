name: Release

# Sólo a mano. Publicar es irreversible -una versión en npm no se puede
# reemplazar- así que el disparador es una persona decidiendo, no un push.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Recorrer todo sin publicar'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # Nada se publica sin pasar la misma puerta que un pull request.
      - name: Verify
        run: pnpm verify

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run
        if: ${{ inputs.dry-run }}
        run: pnpm -r publish --dry-run --no-git-checks
