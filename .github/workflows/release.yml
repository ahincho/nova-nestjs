name: Release

# Solo a mano. Publicar es irreversible -una version en un registry no se
# reemplaza- asi que el disparador es una persona decidiendo, no un push.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Recorrer todo sin publicar'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # registry-url escribe el .npmrc que autentica contra GitHub Packages
      # usando NODE_AUTH_TOKEN. No hace falta un PAT: el GITHUB_TOKEN del run
      # basta con el permiso packages: write declarado arriba.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@ahincho'

      - name: Install
        run: pnpm install --frozen-lockfile

      # Nada se publica sin pasar la misma puerta que un pull request.
      - name: Verify
        run: pnpm verify

      - name: Dry run
        if: ${{ inputs.dry-run }}
        run: pnpm -r publish --dry-run --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the release tags
        if: ${{ !inputs.dry-run }}
        run: git push --follow-tags
