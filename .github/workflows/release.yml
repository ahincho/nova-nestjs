name: Release

# Solo a mano. Publicar es irreversible -una version en un registry no se
# reemplaza- asi que el disparador es una persona decidiendo, no un push.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Recorrer todo sin publicar'
        type: boolean
        default: true
      consumer-ref:
        description: >-
          Rama del servicio de ejemplo contra la que probar. Vacio usa su rama
          por defecto. Solo se llena cuando este release trae un cambio
          incompatible y el ejemplo ya tiene la rama que lo absorbe.
        type: string
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # registry-url escribe el .npmrc que autentica contra GitHub Packages
      # usando NODE_AUTH_TOKEN. No hace falta un PAT: el GITHUB_TOKEN del run
      # basta con el permiso packages: write declarado arriba.
      # Sin matriz a proposito: publicar ocurre una sola vez, y el artefacto
      # no depende del Node que lo construye porque lo compila `tsc`. Que la
      # plataforma corra en 24 y en 26 lo prueba CI, no este workflow.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@ahincho'

      - name: Install
        run: pnpm install --frozen-lockfile

      # Nada se publica sin pasar la misma puerta que un pull request.
      - name: Verify
        run: pnpm verify

      # Ni sin instalarse en un servicio de verdad. La 0.8.0 se publico rota
      # con Verify en verde: el choque de peers entre `@nestjs/cli` y los
      # schematics solo existe en el arbol aplanado de un consumidor.
      - name: Consumer check
        uses: ./.github/actions/consumer-check
        with:
          consumer-ref: ${{ inputs.consumer-ref }}

      # Y ni sin generar un servicio desde cero. El ejemplo esta escrito a mano
      # y no tiene reglas de arquitectura, asi que `lint:arch`, el generador y
      # la imagen solo se ejercitan aca. Sin estos pasos, la puerta del release
      # es mas debil que la de un pull request, que es exactamente al reves de
      # como tiene que ser.
      - name: Generated ACL check
        uses: ./.github/actions/generated-service-check
        with:
          style: acl
          name: academic-acl

      - name: Generated BFF check
        uses: ./.github/actions/generated-service-check
        with:
          style: bff
          name: home-bff

      - name: Dry run
        if: ${{ inputs.dry-run }}
        run: pnpm -r publish --dry-run --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `changeset publish` no consume changesets: publica las versiones que los
      # manifiestos ya llevan. Si `changeset version` no corrió y su commit no
      # está en la rama, esto termina bien y no sube nada, y la corrida queda
      # verde. Pasó seis veces antes de que existiera esta comprobación.
      #
      # changesets crea un tag por paquete publicado, así que un tag nuevo en
      # HEAD es la prueba de que algo salió. Se compara contra los que ya
      # estaban, para que un segundo disparo sobre el mismo commit tampoco pase
      # en falso.
      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: |
          set -euo pipefail
          git tag --points-at HEAD | sort > "$RUNNER_TEMP/tags-antes"
          pnpm release
          git tag --points-at HEAD | sort > "$RUNNER_TEMP/tags-despues"
          nuevos=$(comm -13 "$RUNNER_TEMP/tags-antes" "$RUNNER_TEMP/tags-despues")
          if [ -z "$nuevos" ]; then
            echo "::error::changeset publish no publicó nada. Falta correr 'pnpm version-packages' y dejar ese commit en la rama antes de disparar el release."
            exit 1
          fi
          echo "publicado:"
          echo "$nuevos"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `--tags` y no `--follow-tags`. El segundo empuja sólo tags **anotados**, y
      # los que crea changesets son lightweight: el paso decía «Everything
      # up-to-date» y no subía ninguno. Así se publicaron veintiún versiones sin
      # que quedara en git una sola marca de qué commit produjo cada una.
      - name: Push the release tags
        if: ${{ !inputs.dry-run }}
        run: git push --tags
