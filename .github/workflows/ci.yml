name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Una segunda subida a la misma rama cancela la corrida anterior: nadie mira el
# resultado de un commit que ya fue reemplazado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    # Los paquetes declaran `engines: ">=24.15"`, que permite la linea 26. Sin
    # esta matriz esa afirmacion no estaba probada: se construia, se probaba y
    # se publicaba solo en 24. Ninguno de los 1357 rangos `engines` del arbol
    # excluye 26, pero soporte declarado no es soporte ejercitado.
    #
    # La 25 no esta a proposito: es linea impar y sin soporte a largo plazo, y
    # `vitest` 5 la excluye explicitamente (`^22.12 || ^24 || >=26`).
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Este workflow es autocontenido a proposito. La composite action
      # nova-setup-node de nova-devops acepta un input `package-manager` pero su
      # paso de instalacion siempre corre npm, asi que no sirve para un
      # workspace de pnpm. Migrar a ella cuando soporte pnpm de verdad.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # build, typecheck, cobertura y formato, en ese orden: un paquete consume
      # el dist de su hermano, asi que el typecheck no puede ir primero.
      - name: Verify
        run: pnpm verify

      # Verify solo mira el monorepo, donde cada paquete resuelve su propio
      # arbol. Esto instala los tarballs en un servicio de verdad, que es el
      # unico lugar donde se ven los peers aplanados.
      - name: Consumer check
        uses: ./.github/actions/consumer-check
