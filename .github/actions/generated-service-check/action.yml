name: Generated service check
description: >-
  Genera un servicio desde cero, le instala los tarballs de la plataforma y le
  corre `nova verify` entero. Es lo único que prueba el generador contra un
  árbol de dependencias real.

inputs:
  style:
    description: '`acl` o `bff`. Los dos generan un servicio distinto.'
    required: true
  name:
    description: Nombre del servicio a generar.
    required: true
  feature:
    description: >-
      Primer contexto o feature a generar dentro. Vacio deja el esqueleto
      vacio, que es el otro camino que hay que probar.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # El servicio se genera FUERA del repositorio, y eso es parte de la prueba.
    # Adentro, el `.gitignore` de la plataforma lo alcanza -oxlint sube el árbol
    # buscando archivos de ignore- y `nova lint` termina con «No files found to
    # lint», que además sale con código 1. Un servicio de verdad tampoco vive
    # dentro del repositorio de la plataforma.
    #
    # La CLI de schematics sale de la misma versión de DevKit que declara el
    # paquete: fijarla a mano acá dejaría que las dos divergieran en silencio, y
    # el motor de plantillas es justo la pieza que decide qué se emite.
    #
    # Se apunta al `dist/` del workspace y no al tarball porque lo que se está
    # probando es el servicio que sale, no la forma de invocar al generador.
    - name: Generate the service
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        STYLE: ${{ inputs.style }}
        FEATURE: ${{ inputs.feature }}
        TARGET: ${{ runner.temp }}/generated
      run: |
        set -euo pipefail
        devkit=$(node -p "require('$PWD/packages/schematics/package.json').dependencies['@angular-devkit/schematics']")
        collection="$PWD/packages/schematics/dist/collection.json"
        rm -rf "$TARGET"
        mkdir -p "$TARGET"
        cd "$TARGET"

        # `--no-dry-run` es obligatorio, y no es cosmético. La CLI enciende el
        # modo debug por su cuenta cuando cree que la colección es local, y el
        # debug implica dry-run: imprime los CREATE, no escribe nada y sale con
        # 0. Su prueba de «local» es de ruta POSIX, así que una ruta de Windows
        # no la dispara y una del runner de Linux sí. Sin la bandera este paso
        # pasa en verde sin haber generado nada.
        pnpm dlx "@angular-devkit/schematics-cli@${devkit}" \
          "${collection}:service" "$NAME" --style "$STYLE" --no-dry-run \
          ${FEATURE:+--feature "$FEATURE"}

        # Y por si alguna versión futura vuelve a decidirlo sola.
        test -f "$NAME/package.json"

    # El script borra el `.npmrc` generado, y eso no le quita cobertura: que ese
    # archivo apunte a GitHub Packages lo asegura una prueba unitaria del
    # paquete. Acá hace falta lo contrario -que nada de `@ahincho` pueda venir
    # del registry- porque la versión que se está probando todavía no existe
    # publicada.
    - name: Pack the platform into it
      shell: bash
      run: pnpm consumer:pack "${{ runner.temp }}/generated/${{ inputs.name }}"

    - name: Install
      shell: bash
      working-directory: ${{ runner.temp }}/generated/${{ inputs.name }}
      run: pnpm install --no-frozen-lockfile

    - name: Peers
      shell: bash
      working-directory: ${{ runner.temp }}/generated/${{ inputs.name }}
      run: pnpm peers check

    # `verify` y no `test`: el typecheck, oxlint con sus reglas de tipos,
    # dependency-cruiser y el formato sólo se ejercitan desde acá. El servicio
    # de ejemplo no corre `lint:arch` -no tiene reglas de arquitectura-, así que
    # sin este paso la resolución de dependency-cruiser no la prueba nadie.
    - name: Verify
      shell: bash
      working-directory: ${{ runner.temp }}/generated/${{ inputs.name }}
      run: pnpm verify

    # El montaje de cache de BuildKit vive en el runner, y el runner se destruye:
    # sin exportarla, cada build de CI es frio. `type=gha` la deja en la cache
    # de Actions, que sobrevive entre corridas.
    - name: Set up buildx
      uses: docker/setup-buildx-action@v3

    # `consumer:pack` borra el .npmrc a propósito, para probar que nada de
    # @ahincho puede llegar del registry. El Dockerfile lo copia con un comodín
    # que tolera su ausencia, así que este build no necesita credencial alguna
    # -las dependencias ya entraron por tarball-, y de paso ejercita ese camino.
    - name: Build the image
      shell: bash
      working-directory: ${{ runner.temp }}/generated/${{ inputs.name }}
      run: |
        set -euo pipefail
        pnpm docker --tag "nova-${{ inputs.style }}:ci" \
          --cache-from type=gha,scope=${{ inputs.style }} \
          --cache-to type=gha,mode=max,scope=${{ inputs.style }} \
          --load

    # Que construya no prueba que arranque. Esto sí: levanta el contenedor y le
    # pide la sonda que mira el balanceador.
    - name: Run the image
      shell: bash
      env:
        IMAGE: nova-${{ inputs.style }}:ci
      run: |
        set -euo pipefail
        # NODE_ENV es lo que inyecta la task definition, y es lo que hace que
        # una sola imagen sirva para los tres ambientes. Acá se le pasa
        # `development` para ejercitar el caso inyectado; sin la variable la
        # imagen cae en `production`, que es el default restrictivo.
        id=$(docker run --rm --detach --env NODE_ENV=development --publish 3000:3000 "$IMAGE")
        trap 'docker rm --force "$id" > /dev/null' EXIT

        for attempt in $(seq 1 30); do
          if curl --silent --fail http://localhost:3000/health/live; then
            echo
            echo "el contenedor responde"
            exit 0
          fi
          sleep 2
        done

        echo "el contenedor no respondió en 60 s"
        docker logs "$id"
        exit 1
